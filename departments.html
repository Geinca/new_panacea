<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Panacea Hospital — Departments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="footer.css">

  <style>
   

    header {
      background: #00a000;
      
      padding: 20px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .department-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .department-box {
      border: 1px solid #00a000;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s;
    }

    .department-box:hover {
      background: #e6ffe6;
      transform: translateY(-2px);
    }

    .department-box i {
      font-size: 2rem;
      color: #00a000;
      margin-bottom: 10px;
      display: block;
    }

    .department-box h3 {
      font-size: 1rem;
      color: #0066aa;
      line-height: 1.3;
      margin: 0;
      padding: 0;
    }

    @media (max-width: 768px) {
      .department-box i {
        font-size: 1.6rem;
      }

      .department-box h3 {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <div id="header"></div>
      
    

  <header>New Panacea Hospital Departments</header>

  <section class="department-container">
    <div class="department-box">
      <i class="fa-solid fa-heart-pulse"></i>
      <h3>General &amp; Laparoscopic Surgery</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-notes-medical"></i>
      <h3>Diabetology, Obesity &amp; Metabolic Disorders</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-user-doctor"></i>
      <h3>Cardiology &amp; CTVS</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-hand-holding-heart"></i>
      <h3>Nephrology &amp; Dialysis Care</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-venus"></i>
      <h3>Advance Gynecology</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-user-doctor"></i>
      <h3>Cosmetic Gynecology</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-syringe"></i>
      <h3>Laser Surgery</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-procedures"></i>
      <h3>Hip Joint Replacement</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-person-cane"></i>
      <h3>Knee Replacement</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-stethoscope"></i>
      <h3>Surgical Oncology</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-bone"></i>
      <h3>Orthopaedics</h3>
    </div>
    <div class="department-box">
      <i class="fa-solid fa-user-doctor"></i>
      <h3>Neurology</h3>
    </div>
    <!-- You can add more departments here as needed -->
  </section>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
</body>
</html>
