<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career - New Panacea Hospital</title>
  
  <!-- External Stylesheets -->
  <link rel="stylesheet" href="career.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="footer.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Header -->
  <div id="header"></div>

  <!-- Career Form Section -->
  <section class="career-section">
    <h5 class="career-subtitle">Fill Here</h5>
    <h2 class="career-title">Career</h2>

    <form class="career-form" enctype="multipart/form-data">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required />

      <label for="position">Position Applied For</label>
      <input type="text" id="position" name="position" required />

      <label for="resume">Upload Resume (PDF/DOC)</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required />

      <label for="coverletter">Cover Letter (Optional)</label>
      <textarea id="coverletter" name="coverletter" rows="4"></textarea>

      <button type="submit" class="apply-btn">Apply Now</button>
    </form>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
