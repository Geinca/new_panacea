<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | New Panacea Hospital</title>
  <link rel="stylesheet" href="contact.css" />
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div id="header"></div>

  <section class="contact-section">
    <!-- Left Side Info -->
    <div class="contact-info">
      <div class="info-card">
        <h4>Address line</h4>
        <p>Debpukur, Barrackpore</p>
      </div>
      <div class="info-card">
        <h4>Phone Number</h4>
        <p>033-25938794<br>9051500312<br>8240050422</p>
      </div>
      <div class="info-card">
        <h4>Opening Hours</h4>
        <p>Monday - Friday<br>09:00 AM - 05:00 PM</p>
      </div>
    </div>

    <!-- Right Side Form -->
    <div class="contact-form">
      <h2>Send us a Message :</h2>
      <form>
        <div class="form-row">
          <input type="text" placeholder="Enter your Name">
          <input type="email" placeholder="Enter your mail">
        </div>
        <div class="form-row">
          <input type="text" placeholder="Enter your number">
          <input type="text" placeholder="Enter your website">
        </div>
        <textarea placeholder="Type your comment"></textarea>
        <button type="submit">SEND MESSAGE</button>
      </form>

      <!-- Embedded Google Map -->
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps?q=Debpukur,%20Barrackpore,%20West%20Bengal&output=embed"
          width="100%"
          height="250"
          frameborder="0"
          style="border:0;"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>
    </div>
  </section>
  <div id="footer-placeholder"></div>
  
  <script src="script.js"></script>
</body>
</html>
